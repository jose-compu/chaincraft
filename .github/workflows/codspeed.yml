# Performance benchmarks tracked with CodSpeed (CPU simulation).

name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # Allows CodSpeed to trigger backtest performance analysis
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[bench]"
    - name: Run benchmarks
      uses: CodSpeedHQ/action@v5
      with:
        mode: simulation
        run: python -m pytest benchmarks --codspeed
